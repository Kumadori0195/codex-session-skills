name: Validate skills

on:
  push:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill packages
    runs-on: ubuntu-latest
    env:
      VALIDATOR_REF: 49f948faa9258a0c61caceaf225e179651397431
      VALIDATOR_SHA256: 6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check --no-warn-script-location "PyYAML==6.0.2"

      - name: Download pinned validator
        env:
          VALIDATOR_PATH: "${{ runner.temp }}/quick_validate.py"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/openai/skills/${VALIDATOR_REF}/skills/.system/skill-creator/scripts/quick_validate.py" \
            --output "${VALIDATOR_PATH}"
          echo "${VALIDATOR_SHA256}  ${VALIDATOR_PATH}" | sha256sum --check

      - name: Validate skill packages
        env:
          VALIDATOR_PATH: "${{ runner.temp }}/quick_validate.py"
        run: |
          set -euo pipefail
          for skill_dir in skills/*; do
            if [[ -d "${skill_dir}" ]]; then
              echo "::group::${skill_dir}"
              python "${VALIDATOR_PATH}" "${skill_dir}"
              echo "::endgroup::"
            fi
          done
